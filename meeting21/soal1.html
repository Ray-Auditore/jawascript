<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h2>Masukkan Nama Anda</h2>
    <input type="text" id="nameInput" placeholder="Masukkan nama anda" />
    <button onclick="simpanNama()">Simpan</button>
    <p id="tampilkanNama"></p>
    <button onclick="hapusNama()">Hapus</button>
    <p id="tampilkanNama"></p>
    <p id="status"></p>
  </body>
  <script>
    function simpanNama() {
      const nameInput = document.getElementById("nameInput").value;
      localStorage.setItem("username", nameInput); 
      tampilkanNamaTersimpan();
    }

    function hapusNama() {
      localStorage.removeItem("username");
      tampilkanNamaTersimpan();
      document.getElementById("status").textContent = "Username dihapus.";
    }

    function tampilkanNamaTersimpan() {
      const namaTersimpan = localStorage.getItem("username");
      const elemenTampilkanNama = document.getElementById("tampilkanNama");
      const elemenStatus = document.getElementById("status");

      if (namaTersimpan) {
        elemenTampilkanNama.textContent = `Halo, ${namaTersimpan}!`;
        elemenStatus.textContent = "Nama pengguna tersedia.";
      } else {
        elemenTampilkanNama.textContent = "Anda belum memasukkan nama.";
        elemenStatus.textContent = "Nama pengguna tidak tersedia.";
      }
    }

    window.onload = tampilkanNamaTersimpan;
  </script>
</html>
